[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfactory-cloud"
version = "0.1.0"
description = "Lokiravia by Lokvetia — local game idea and first-playable planning workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["agent-factory-orchestrator[web] @ git+https://github.com/HappyMiha/Lokvetia-Core.git@3a045322954a7d46aa23b0db96626f051c273713"]

[project.scripts]
lokiravia = "agentfactory_cloud.brief_web:main"
agentfactory-brief = "agentfactory_cloud.brief_web:main"

[project.urls]
Homepage = "https://lokiravia.com"
Repository = "https://github.com/HappyMiha/Lokiravia"
Documentation = "https://github.com/HappyMiha/Lokiravia/blob/main/docs/game-brief-intake.md"
Issues = "https://github.com/HappyMiha/Lokiravia/issues"
"Lokvetia Core" = "https://github.com/HappyMiha/Lokvetia-Core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentfactory_cloud = ["static/*"]
